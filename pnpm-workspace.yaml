allowBuilds:
  esbuild: true
# install the @napi-rs/canvas binaries of every OS we ship in the .mcpb
supportedArchitectures:
  os: [current, darwin, win32]
  cpu: [current, arm64, x64]
# one KaTeX: rehype-katex pins ^0.16 while katex.min.css comes from our 0.19; mismatched class names broke \neq (M18a)
overrides:
  katex: 0.19.0
