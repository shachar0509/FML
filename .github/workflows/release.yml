name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # supportedArchitectures (pnpm-workspace.yaml) installs the macOS and Windows canvas binaries on this Linux runner
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack:mcpb
      - run: pnpm smoke:mcpb
      - uses: softprops/action-gh-release@v2
        with:
          name: "Shalav ${{ github.ref_name }}"
          files: dist/shalav.mcpb
